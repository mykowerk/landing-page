<div class="sub-footer">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="sub-footer-inner">
          {% if site.data.social %}
            {% include social.html %}
          {% endif %}

          {% if site.data.sponsors and site.data.sponsors.size > 0 %}
          <div class="sponsors">
            {% for sponsor in site.data.sponsors %}
              <a href="{{ sponsor.url }}" target="_blank" rel="noopener noreferrer" class="sponsor-link" aria-label="{{ sponsor.name }}">
                <img src="{{ sponsor.logo | relative_url }}" alt="{{ sponsor.name }}" class="sponsor-logo">
              </a>
            {% endfor %}
          </div>
          {% endif %}

          {% if site.data.seo.copyright_text %}
          <div class="copyright">{{ site.data.seo.copyright_text }}</div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
